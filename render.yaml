# Render Blueprint: https://render.com/docs/infrastructure-as-code
# Sync once from the Render dashboard (Blueprints -> New Blueprint -> this repo/branch).
# `render blueprints validate` checks it locally if you have the Render CLI.
#
# Chosen plan: FREE. What that means:
#   * the single web service (UI + API combined via RUN_COMBINED) sleeps after
#     ~15 min idle (~1 min cold start) and uses the workspace's 750
#     instance-hours/month,
#   * the Postgres instance EXPIRES 30 DAYS AFTER CREATION (then deleted 14 days
#     later, no backups) — re-run the steps below around day 25, or upgrade the DB,
#   * no persistent disk, so GET /docs/<file> 404s (answers/citations unaffected).
#
# The data load is one-time and runs from THIS repo's directory, against the
# database's *external* connection string (Render dashboard -> DB -> Connections).
# The fromDatabase wiring below hands the services Render's internal hostname,
# which only resolves inside Render's network, so a local machine must use the
# external one.
#
# IMPORTANT: prefix with PIPENV_DONT_LOAD_ENV=1. Both the makefile (`-include .env`)
# and pipenv (`pipenv run`, which loads .env) otherwise override DATABASE_URL with
# the LOCAL value in .env, so the load silently hits your local DB instead of Render.
#
#   PIPENV_DONT_LOAD_ENV=1 make db-setup               DATABASE_URL=<external>
#   PIPENV_DONT_LOAD_ENV=1 make ingest-questions-store DATABASE_URL=<external>
#
# (Skip `make ingest` — no books — and `make ingest-questions`, the JSON is already
# extracted. `make db-setup` re-drops frm_questions, so always run the store step after.)

services:
  # One combined paid always-on service. RUN_COMBINED runs gunicorn on loopback
  # + Streamlit on $PORT in the same container; the UI reaches the API at
  # http://127.0.0.1:5000, so the API is NOT publicly callable — only the UI is.
  - type: web
    runtime: docker
    name: tutor-agent-api
    plan: 0.5c-512mb
    healthCheckPath: /_stcore/health
    # No disk is attached, so GET /docs/<file> 404s — answers/citations still
    # work, only the PDF links die. Add a `disk:` block with mountPath /books if
    # hosted PDF links are needed.
    envVars:
      - key: RUN_COMBINED
        value: "1"
      # Paid always-on service also runs the three-question backfill every five minutes.
      - key: RUN_BACKFILL_SCHEDULER
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: tutor-agent-db
          property: connectionString
      - key: BOOKS_DIR
        value: /books
      - key: QUESTIONS_DIR
        value: /books
      # Prompted at sync time; required for MCQ answers and backfill.
      - key: GEMINI_API_KEY
        sync: false
      - key: MCQ_TEMPERATURE
        value: "0.2"
      - key: MCQ_MAX_TOKENS
        value: "4000"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

databases:
  # PG 13+ needed for `CREATE EXTENSION vector` (sql/schema.sql runs it in db-setup).
  - name: tutor-agent-db
    plan: free
    postgresMajorVersion: "16"
