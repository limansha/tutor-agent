# Render Blueprint: https://render.com/docs/infrastructure-as-code
# Sync once from the Render dashboard (Blueprints -> New Blueprint -> this repo/branch).
# `render blueprints validate` checks it locally if you have the Render CLI.
#
# Chosen plan: FREE. What that means:
#   * both web services sleep after ~15 min idle (~1 min cold start) and share the
#     workspace's 750 instance-hours/month,
#   * the Postgres instance EXPIRES 30 DAYS AFTER CREATION (then deleted 14 days
#     later, no backups) — re-run the steps below around day 25, or upgrade the DB,
#   * no persistent disk, so GET /docs/<file> 404s (answers/citations unaffected).
#
# The data load is one-time and runs from THIS repo's directory, against the
# database's *external* connection string (Render dashboard -> DB -> Connections).
# The fromDatabase wiring below hands the services Render's internal hostname,
# which only resolves inside Render's network, so a local machine must use the
# external one.
#
# IMPORTANT: prefix with PIPENV_DONT_LOAD_ENV=1. Both the makefile (`-include .env`)
# and pipenv (`pipenv run`, which loads .env) otherwise override DATABASE_URL with
# the LOCAL value in .env, so the load silently hits your local DB instead of Render.
#
#   PIPENV_DONT_LOAD_ENV=1 make db-setup               DATABASE_URL=<external>
#   PIPENV_DONT_LOAD_ENV=1 make ingest-questions-store DATABASE_URL=<external>
#
# (Skip `make ingest` — no books — and `make ingest-questions`, the JSON is already
# extracted. `make db-setup` re-drops frm_questions, so always run the store step after.)

services:
  # Flask API — served by the image's CMD, which binds 0.0.0.0:$PORT.
  - type: web
    runtime: docker
    name: tutor-agent-api
    plan: free
    healthCheckPath: /api/health
    # Free web services cannot attach a disk (and no other service can read one
    # anyway), so GET /docs/<file> 404s — answers/citations still work, only the
    # PDF links die. To restore them on a paid plan, add a `disk:` block here with
    # mountPath /books and drop the PDFs in via the Render shell.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tutor-agent-db
          property: connectionString
      # Prompted at sync time; required for /api/mcq-answer (retrieval works without).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BOOKS_DIR
        value: /books
      - key: QUESTIONS_DIR
        value: /books
      # Hosted corpus is questions-only, so /api/mcq-answer searches the web
      # instead of frm_books. Free models keep it on the free tier; swap to
      # paid slugs once credits exist (OPENROUTER_MODEL=openai/gpt-oss-20b).
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      # Tuning knobs, exposed so they can be changed from the dashboard without a
      # redeploy. TEMPERATURE 0.2 keeps answers stable; MAX_TOKENS caps request
      # size (hence credit cost) and bounds the final structured answer.
      - key: OPENROUTER_TEMPERATURE
        value: "0.2"
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"
      # Optional cross-provider fallbacks (app/llm/): independent quotas so an
      # OpenRouter 429 doesn't take the endpoint down. Leave blank to skip a hop.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

  # Streamlit UI — same image; RUN_UI=1 makes the image's CMD run Streamlit instead
  # of gunicorn (passing a nested `sh -c '...'` as dockerCommand breaks Render's
  # command handling). API_BASE_URL is Render's public URL for the API, copied
  # across so renaming the service updates it automatically.
  - type: web
    runtime: docker
    name: tutor-agent-ui
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: RUN_UI
        value: "1"
      - key: API_BASE_URL
        fromService:
          name: tutor-agent-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # PG 13+ needed for `CREATE EXTENSION vector` (sql/schema.sql runs it in db-setup).
  - name: tutor-agent-db
    plan: free
    postgresMajorVersion: "16"
